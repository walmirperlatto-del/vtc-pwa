<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora VTC</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #121212;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #aaa;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #1e1e1e;
      color: #fff;
      font-size: 16px;
      text-align: right;
    }

    input:focus {
      outline: 2px solid #00e5ff;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-calc {
      background: #00e5ff;
      color: #000;
    }

    .btn-clear {
      background: #333;
      color: #fff;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      background: #1a1a1a;
      border-radius: 12px;
      text-align: center;
      font-size: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .card {
      background: #202020;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
    }

    .card span {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .card strong {
      font-size: 16px;
    }

    .info {
      margin-top: 12px;
      font-size: 11px;
      text-align: center;
      color: #777;
    }

    /* Valor principal VTC */
    .result strong {
    color: #00e5ff;
    }

    /* Deltas positivos */
    .card.delta-plus strong {
    color: #00ff88;
    }

    /* Deltas negativos */
    .card.delta-minus strong {
    color: #ff5c5c;
    }
    
  </style>
</head>

<body>

  <div id="ios-install-banner" style="
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:#0b0b0b;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    font-family:Arial, Helvetica, sans-serif;
  ">
    <h2 style="margin-bottom:12px;">Instale este app no iPhone</h2>

    <p style="font-size:14px; color:#aaa; max-width:320px;">
      Para uma melhor experiência, adicione este app à sua Tela de Início.
    </p>

    <p style="font-size:14px; margin-top:12px;">
      Toque em <strong>Compartilhar</strong><br>
      e depois em<br>
      <strong>“Adicionar à Tela de Início”</strong>
    </p>
  </div>


  <div class="container">
    <h1>Calculadora VTC</h1>

    <div class="field">
      <label>Valor do Preço de Fechamento</label>
      <input 
        id="fechamento" 
        placeholder="Ex: 5234,50"
        inputmode="decimal"
        pattern="[0-9]*"
      >
    </div>

    <div class="field">
      <label>Valor do Preço de Abertura</label>
      <input 
        id="abertura" 
        placeholder="Ex: 5200.00"
        inputmode="decimal"
        pattern="[0-9]*"
      >
    </div>

    <div class="field">
      <label>Valor da PTAX 1</label>
      <input 
        id="ptax" 
        placeholder="Ex: 5210,25"
        inputmode="decimal"
        pattern="[0-9]*"
      >
    </div>

    <div class="buttons">
      <button class="btn-calc" onclick="calcular()">Calcular</button>
      <button class="btn-clear" onclick="zerar()">Zerar</button>
    </div>

    <div id="resultado"></div>

    <div class="info">
      Aceita ponto (.) ou vírgula (,) para casas decimais
    </div>
  </div>

  <script>
    function normalizar(valor) {
      return parseFloat(valor.replace(',', '.'));
    }

    function calcular() {
      const fechamento = normalizar(document.getElementById("fechamento").value);
      const abertura   = normalizar(document.getElementById("abertura").value);
      const ptax       = normalizar(document.getElementById("ptax").value);

      if (isNaN(fechamento) || isNaN(abertura) || isNaN(ptax)) {
        alert("Preencha todos os campos corretamente.");
        return;
      }

      const vtc = (fechamento + abertura + ptax) / 3;

      const dMais05  = vtc * 1.005;
      const dMais1   = vtc * 1.01;
      const dMenos05 = vtc * 0.995;
      const dMenos1  = vtc * 0.99;

      document.getElementById("resultado").innerHTML = `
        <div class="result">
          <strong>VTC</strong><br>${vtc.toFixed(2)}
        </div>

        <div class="cards">
          <div class="card delta-plus">
            <span>Delta +</span>
            <strong>${dMais05.toFixed(2)}</strong>
          </div>
          <div class="card delta-plus">
            <span>Delta + +</span>
            <strong>${dMais1.toFixed(2)}</strong>
          </div>
          <div class="card delta-minus">
            <span>Delta -</span>
            <strong>${dMenos05.toFixed(2)}</strong>
          </div>
          <div class="card delta-minus">
            <span>Delta - -</span>
            <strong>${dMenos1.toFixed(2)}</strong>
          </div>
        </div>
      `;
    }

    function zerar() {
      document.getElementById("fechamento").value = "";
      document.getElementById("abertura").value = "";
      document.getElementById("ptax").value = "";
      document.getElementById("resultado").innerHTML = "";
    }
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;

      if (isIOS && !isStandalone) {

        document.body.innerHTML = `
          <div style="
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            background:#0b0b0b;
            color:#fff;
            text-align:center;
            padding:20px;
            font-family:Arial, Helvetica, sans-serif;
          ">
            <h2 style="margin-bottom:12px;">Instale este app no iPhone</h2>
            <p style="font-size:14px; color:#aaa; max-width:320px;">
              Para uma melhor experiência, adicione este app à sua Tela de Início.
            </p>
            <p style="font-size:14px; margin-top:12px;">
              Toque em <strong>Compartilhar</strong><br>
              e depois em<br>
              <strong>“Adicionar à Tela de Início”</strong>
            </p>
          </div>
        `;
      }

  });
  </script>
  
</body>
</html>
